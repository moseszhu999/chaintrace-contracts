name: Recover Base Sepolia deployment evidence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
  CONTRACT_ADDRESS: 0x6eE7ec00035b17C8D1dE1D24458552441D8A93c7
  DEPLOYER_ADDRESS: 0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9
  DEPLOYMENT_TIME_UTC: 2026-08-01T01:27:23+00:00

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    name: Verify bytecode, recover creation transaction, and persist evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v4

      - name: Recover deployment evidence from Base Sepolia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments deployment-output
          python - <<'PY'
          from datetime import datetime
          import json
          import os
          import urllib.request

          rpc_url = os.environ["BASE_SEPOLIA_RPC_URL"]
          deployer = os.environ["DEPLOYER_ADDRESS"].lower()
          contract_address = os.environ["CONTRACT_ADDRESS"].lower()
          target_timestamp = int(datetime.fromisoformat(os.environ["DEPLOYMENT_TIME_UTC"]).timestamp())

          def rpc(method, params):
              payload = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": params,
              }).encode()
              request = urllib.request.Request(
                  rpc_url,
                  data=payload,
                  headers={"content-type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          chain_id = int(rpc("eth_chainId", []), 16)
          if chain_id != 84532:
              raise RuntimeError(f"Expected Base Sepolia chain ID 84532, received {chain_id}")

          bytecode = rpc("eth_getCode", [contract_address, "latest"])
          if bytecode == "0x":
              raise RuntimeError(f"No deployed bytecode found at {contract_address}")

          deployer_nonce = int(rpc("eth_getTransactionCount", [deployer, "latest"]), 16)
          if deployer_nonce < 1:
              raise RuntimeError("Deployer nonce does not show a confirmed transaction")

          latest = int(rpc("eth_blockNumber", []), 16)

          # Binary-search the block nearest the known broadcast time. This avoids
          # rate-limited full-chain scans against the public Base Sepolia RPC.
          low = 0
          high = latest
          while low < high:
              middle = (low + high) // 2
              block = rpc("eth_getBlockByNumber", [hex(middle), False])
              block_timestamp = int(block["timestamp"], 16)
              if block_timestamp < target_timestamp:
                  low = middle + 1
              else:
                  high = middle
          center = low

          found = None
          start = max(0, center - 180)
          end = min(latest, center + 180)
          for number in range(start, end + 1):
              block = rpc("eth_getBlockByNumber", [hex(number), True])
              if not block:
                  continue
              for transaction in block.get("transactions", []):
                  if transaction.get("from", "").lower() != deployer:
                      continue
                  if transaction.get("to") is not None:
                      continue
                  receipt = rpc("eth_getTransactionReceipt", [transaction["hash"]])
                  if not receipt:
                      continue
                  receipt_contract = (receipt.get("contractAddress") or "").lower()
                  if receipt_contract != contract_address:
                      continue
                  found = {
                      "transactionHash": transaction["hash"],
                      "blockNumber": str(int(receipt["blockNumber"], 16)),
                      "status": int(receipt["status"], 16),
                  }
                  break
              if found:
                  break

          if not found:
              raise RuntimeError(
                  "Contract bytecode exists, but its creation transaction was not found "
                  "within the bounded deployment-time block window"
              )
          if found["status"] != 1:
              raise RuntimeError("Recovered deployment transaction did not succeed")

          evidence = {
              "network": "base-sepolia",
              "chainId": chain_id,
              "contractName": "TradeProofRegistry",
              "address": os.environ["CONTRACT_ADDRESS"],
              "transactionHash": found["transactionHash"],
              "blockNumber": found["blockNumber"],
              "deployer": os.environ["DEPLOYER_ADDRESS"],
              "registrySourceCommit": "27248faeed7f3eb88428fa8ce7979223e088429f",
              "bytecodeSizeBytes": (len(bytecode) - 2) // 2,
              "bytecodeVerified": True,
              "sourceVerification": "not-yet-recorded",
              "explorerUrl": (
                  "https://sepolia.basescan.org/address/"
                  + os.environ["CONTRACT_ADDRESS"]
              ),
          }
          rendered = json.dumps(evidence, indent=2) + "\n"
          for path in (
              "deployments/base-sepolia.json",
              "deployment-output/base-sepolia.json",
          ):
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(rendered)
          print(rendered)
          PY

      - name: Publish deployment summary
        shell: bash
        run: |
          set -euo pipefail
          ADDRESS="$(jq -r '.address' deployments/base-sepolia.json)"
          TX_HASH="$(jq -r '.transactionHash' deployments/base-sepolia.json)"
          BLOCK_NUMBER="$(jq -r '.blockNumber' deployments/base-sepolia.json)"
          BYTECODE_SIZE="$(jq -r '.bytecodeSizeBytes' deployments/base-sepolia.json)"
          {
            echo "## TradeProofRegistry Base Sepolia deployment"
            echo ""
            echo "- Address: \`$ADDRESS\`"
            echo "- Transaction: \`$TX_HASH\`"
            echo "- Block: \`$BLOCK_NUMBER\`"
            echo "- Bytecode: \`$BYTECODE_SIZE bytes\`"
            echo "- Chain ID: \`84532\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist canonical deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          git add deployments/base-sepolia.json
          if git diff --cached --quiet; then
            echo "Canonical deployment manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record TradeProofRegistry Base Sepolia deployment evidence"
          git push

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: trade-proof-registry-base-sepolia-evidence
          path: deployment-output/base-sepolia.json
          if-no-files-found: error
