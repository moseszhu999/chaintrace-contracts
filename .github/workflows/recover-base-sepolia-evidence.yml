name: Recover Base Sepolia deployment evidence

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
  BLOCKSCOUT_API_URL: https://base-sepolia.blockscout.com/api/v2
  CONTRACT_ADDRESS: 0x6eE7ec00035b17C8D1dE1D24458552441D8A93c7
  DEPLOYER_ADDRESS: 0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    name: Verify and persist Base Sepolia deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v4

      - name: Recover deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments deployment-output
          python - <<'PY'
          import json
          import os
          import urllib.request

          rpc_url = os.environ["BASE_SEPOLIA_RPC_URL"]
          api_url = os.environ["BLOCKSCOUT_API_URL"]
          contract_address = os.environ["CONTRACT_ADDRESS"]
          deployer_address = os.environ["DEPLOYER_ADDRESS"]

          def get_json(url):
              request = urllib.request.Request(url, headers={"accept": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          def rpc(method, params):
              payload = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": params,
              }).encode()
              request = urllib.request.Request(
                  rpc_url,
                  data=payload,
                  headers={"content-type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          address_info = get_json(f"{api_url}/addresses/{contract_address}")
          tx_hash = address_info.get("creation_transaction_hash")
          creator = address_info.get("creator_address_hash")
          if not tx_hash:
              raise RuntimeError("Blockscout has not indexed the contract creation transaction")
          if not creator or creator.lower() != deployer_address.lower():
              raise RuntimeError(f"Unexpected contract creator: {creator}")

          chain_id = int(rpc("eth_chainId", []), 16)
          if chain_id != 84532:
              raise RuntimeError(f"Expected Base Sepolia chain ID 84532, received {chain_id}")

          bytecode = rpc("eth_getCode", [contract_address, "latest"])
          if bytecode == "0x":
              raise RuntimeError(f"No deployed bytecode found at {contract_address}")

          receipt = rpc("eth_getTransactionReceipt", [tx_hash])
          transaction = rpc("eth_getTransactionByHash", [tx_hash])
          if not receipt or not transaction:
              raise RuntimeError("Creation transaction or receipt is unavailable")
          if int(receipt["status"], 16) != 1:
              raise RuntimeError("Creation transaction failed")
          if (receipt.get("contractAddress") or "").lower() != contract_address.lower():
              raise RuntimeError("Receipt contract address does not match")
          if transaction.get("from", "").lower() != deployer_address.lower():
              raise RuntimeError("Creation transaction deployer does not match")
          if transaction.get("to") is not None:
              raise RuntimeError("Recovered transaction is not contract creation")
          if int(transaction.get("nonce", "0x0"), 16) != 0:
              raise RuntimeError("Creation transaction nonce is not zero")

          evidence = {
              "network": "base-sepolia",
              "chainId": chain_id,
              "contractName": "TradeProofRegistry",
              "address": contract_address,
              "transactionHash": tx_hash,
              "blockNumber": str(int(receipt["blockNumber"], 16)),
              "deployer": deployer_address,
              "registrySourceCommit": "27248faeed7f3eb88428fa8ce7979223e088429f",
              "bytecodeSizeBytes": (len(bytecode) - 2) // 2,
              "bytecodeVerified": True,
              "sourceVerification": "not-yet-recorded",
              "explorerUrl": f"https://sepolia.basescan.org/address/{contract_address}",
          }
          rendered = json.dumps(evidence, indent=2) + "\n"
          for path in (
              "deployments/base-sepolia.json",
              "deployment-output/base-sepolia.json",
          ):
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(rendered)
          print(rendered)
          PY

      - name: Persist canonical deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          git add deployments/base-sepolia.json
          if git diff --cached --quiet; then
            echo "Canonical deployment manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record TradeProofRegistry Base Sepolia deployment evidence"
          git push

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: trade-proof-registry-base-sepolia-evidence
          path: deployment-output/base-sepolia.json
          if-no-files-found: error
