name: Deploy TradeProofRegistry to Base Sepolia

on:
  push:
    branches:
      - deploy/base-sepolia-trade-proof-registry-v1

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
  DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
  RECOVERY_CONTRACT_ADDRESS: 0x6eE7ec00035b17C8D1dE1D24458552441D8A93c7

jobs:
  deploy:
    name: Broadcast reviewed registry deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact deployment source
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require deployment secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYER_PRIVATE_KEY:-}" ]; then
            echo "DEPLOYER_PRIVATE_KEY GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Verify Base Sepolia and deployer balance
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY="$DEPLOYER_PRIVATE_KEY"
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          CHAIN_ID="$(cast chain-id --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          if [ "$CHAIN_ID" != "84532" ]; then
            echo "Expected Base Sepolia chain ID 84532, received $CHAIN_ID"
            exit 1
          fi
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          BALANCE_WEI="$(cast balance "$DEPLOYER" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          echo "Deployer: $DEPLOYER"
          echo "Balance (wei): $BALANCE_WEI"
          if [ "$BALANCE_WEI" = "0" ]; then
            echo "Deployment wallet has no Base Sepolia ETH."
            exit 1
          fi
          echo "DEPLOYER_ADDRESS=$DEPLOYER" >> "$GITHUB_ENV"

      - name: Detect an already accepted deployment
        shell: bash
        run: |
          set -euo pipefail
          BYTECODE="$(cast code "$RECOVERY_CONTRACT_ADDRESS" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          if [ "$BYTECODE" != "0x" ]; then
            echo "Recovered deployed bytecode at $RECOVERY_CONTRACT_ADDRESS"
            echo "DEPLOYMENT_RECOVERED=true" >> "$GITHUB_ENV"
          else
            echo "No bytecode at recovery address; a fresh broadcast is required."
            echo "DEPLOYMENT_RECOVERED=false" >> "$GITHUB_ENV"
          fi

      - name: Build and test exact source
        run: |
          forge build --sizes
          forge test -vvv

      - name: Simulate deployment
        if: env.DEPLOYMENT_RECOVERED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY="$DEPLOYER_PRIVATE_KEY"
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          forge script script/DeployTradeProofRegistry.s.sol:DeployTradeProofRegistry \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY"

      - name: Broadcast deployment
        if: env.DEPLOYMENT_RECOVERED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY="$DEPLOYER_PRIVATE_KEY"
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          forge script script/DeployTradeProofRegistry.s.sol:DeployTradeProofRegistry \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --slow

      - name: Verify deployed bytecode and write manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-output

          if [ "${DEPLOYMENT_RECOVERED:-false}" = "true" ]; then
            CONTRACT_ADDRESS="$RECOVERY_CONTRACT_ADDRESS"
            export CONTRACT_ADDRESS
            python - <<'PY' > deployment-output/recovered-transaction.json
          import json
          import os
          import urllib.request

          rpc_url = os.environ["BASE_SEPOLIA_RPC_URL"]
          deployer = os.environ["DEPLOYER_ADDRESS"].lower()
          contract_address = os.environ["CONTRACT_ADDRESS"].lower()

          def rpc(method, params):
              payload = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode()
              request = urllib.request.Request(rpc_url, data=payload, headers={"content-type": "application/json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          latest = int(rpc("eth_blockNumber", []), 16)
          found = None
          for number in range(latest, max(-1, latest - 900), -1):
              block = rpc("eth_getBlockByNumber", [hex(number), True])
              if not block:
                  continue
              for transaction in block.get("transactions", []):
                  if transaction.get("from", "").lower() != deployer:
                      continue
                  if transaction.get("to") is not None:
                      continue
                  receipt = rpc("eth_getTransactionReceipt", [transaction["hash"]])
                  if receipt and receipt.get("contractAddress", "").lower() == contract_address:
                      found = {
                          "transactionHash": transaction["hash"],
                          "blockNumber": str(int(receipt["blockNumber"], 16)),
                      }
                      break
              if found:
                  break

          if not found:
              raise RuntimeError("Unable to recover the contract creation transaction from recent Base Sepolia blocks")
          print(json.dumps(found))
          PY
            TX_HASH="$(jq -r '.transactionHash' deployment-output/recovered-transaction.json)"
            BLOCK_NUMBER="$(jq -r '.blockNumber' deployment-output/recovered-transaction.json)"
          else
            BROADCAST_FILE="broadcast/DeployTradeProofRegistry.s.sol/84532/run-latest.json"
            test -f "$BROADCAST_FILE"
            CONTRACT_ADDRESS="$(jq -r '[.transactions[] | select(.transactionType == "CREATE")][0].contractAddress' "$BROADCAST_FILE")"
            TX_HASH="$(jq -r '[.transactions[] | select(.transactionType == "CREATE")][0].hash' "$BROADCAST_FILE")"
            BLOCK_NUMBER_HEX="$(jq -r '[.receipts[]][0].blockNumber' "$BROADCAST_FILE")"
            BLOCK_NUMBER="$((BLOCK_NUMBER_HEX))"
          fi

          if [ -z "$CONTRACT_ADDRESS" ] || [ "$CONTRACT_ADDRESS" = "null" ]; then
            echo "Contract address was not found."
            exit 1
          fi

          BYTECODE="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          if [ "$BYTECODE" = "0x" ]; then
            echo "No deployed bytecode found at $CONTRACT_ADDRESS"
            exit 1
          fi

          jq -n \
            --arg network "base-sepolia" \
            --argjson chainId 84532 \
            --arg contractName "TradeProofRegistry" \
            --arg address "$CONTRACT_ADDRESS" \
            --arg transactionHash "$TX_HASH" \
            --arg blockNumber "$BLOCK_NUMBER" \
            --arg deployer "$DEPLOYER_ADDRESS" \
            --arg registrySourceCommit "27248faeed7f3eb88428fa8ce7979223e088429f" \
            --arg deploymentCarrierCommit "$GITHUB_SHA" \
            --arg explorerUrl "https://sepolia.basescan.org/address/$CONTRACT_ADDRESS" \
            '{
              network: $network,
              chainId: $chainId,
              contractName: $contractName,
              address: $address,
              transactionHash: $transactionHash,
              blockNumber: $blockNumber,
              deployer: $deployer,
              registrySourceCommit: $registrySourceCommit,
              deploymentCarrierCommit: $deploymentCarrierCommit,
              explorerUrl: $explorerUrl,
              bytecodeVerified: true,
              sourceVerification: "not-yet-recorded"
            }' > deployment-output/base-sepolia.json

          cat deployment-output/base-sepolia.json
          echo "Contract: $CONTRACT_ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Transaction: $TX_HASH" >> "$GITHUB_STEP_SUMMARY"
          echo "Block: $BLOCK_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Explorer: https://sepolia.basescan.org/address/$CONTRACT_ADDRESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: trade-proof-registry-base-sepolia
          path: |
            deployment-output/base-sepolia.json
            deployment-output/recovered-transaction.json
            broadcast/DeployTradeProofRegistry.s.sol/84532/run-latest.json
          if-no-files-found: error

      - name: Publish deployment result to carrier PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADDRESS="$(jq -r '.address' deployment-output/base-sepolia.json)"
          TX_HASH="$(jq -r '.transactionHash' deployment-output/base-sepolia.json)"
          BLOCK_NUMBER="$(jq -r '.blockNumber' deployment-output/base-sepolia.json)"
          cat > deployment-output/pr-comment.md <<EOF
          <!-- trade-proof-deployment-result -->
          ## Base Sepolia deployment: PASS

          - Contract: \`TradeProofRegistry\`
          - Address: \`$CONTRACT_ADDRESS\`
          - Transaction: \`$TX_HASH\`
          - Block: \`$BLOCK_NUMBER\`
          - Deployer: \`$DEPLOYER_ADDRESS\`
          - Chain ID: \`84532\`
          - Registry source commit: \`27248faeed7f3eb88428fa8ce7979223e088429f\`
          - Bytecode check: **PASS**
          - Source verification: pending

          Explorer: https://sepolia.basescan.org/address/$CONTRACT_ADDRESS
          EOF

          COMMENT_ID="$(gh api repos/moseszhu999/chaintrace-contracts/issues/2/comments --paginate --jq '.[] | select(.body | contains("<!-- trade-proof-deployment-result -->")) | .id' | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/moseszhu999/chaintrace-contracts/issues/comments/$COMMENT_ID" --raw-field body="$(cat deployment-output/pr-comment.md)"
          else
            gh pr comment 2 --repo moseszhu999/chaintrace-contracts --body-file deployment-output/pr-comment.md
          fi
