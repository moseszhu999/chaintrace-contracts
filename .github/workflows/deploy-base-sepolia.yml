name: Recover TradeProofRegistry Base Sepolia deployment

on:
  push:
    branches:
      - deploy/base-sepolia-trade-proof-registry-v1

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
  BLOCKSCOUT_API_URL: https://base-sepolia.blockscout.com/api/v2
  CONTRACT_ADDRESS: 0x6eE7ec00035b17C8D1dE1D24458552441D8A93c7
  DEPLOYER_ADDRESS: 0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9

jobs:
  recover:
    name: Verify bytecode and recover accepted deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployment carrier
        uses: actions/checkout@v4

      - name: Recover deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-output
          python - <<'PY'
          import json
          import os
          import urllib.request

          rpc_url = os.environ["BASE_SEPOLIA_RPC_URL"]
          api_url = os.environ["BLOCKSCOUT_API_URL"]
          contract_address = os.environ["CONTRACT_ADDRESS"]
          deployer_address = os.environ["DEPLOYER_ADDRESS"]

          def get_json(url):
              request = urllib.request.Request(url, headers={"accept": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          def rpc(method, params):
              payload = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": params,
              }).encode()
              request = urllib.request.Request(
                  rpc_url,
                  data=payload,
                  headers={"content-type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode())
              if "error" in result:
                  raise RuntimeError(result["error"])
              return result["result"]

          address_info = get_json(f"{api_url}/addresses/{contract_address}")
          tx_hash = address_info.get("creation_transaction_hash")
          creator = address_info.get("creator_address_hash")
          if not tx_hash:
              raise RuntimeError("Blockscout has not indexed a creation transaction for the contract")
          if not creator or creator.lower() != deployer_address.lower():
              raise RuntimeError(f"Unexpected contract creator: {creator}")

          chain_id = int(rpc("eth_chainId", []), 16)
          if chain_id != 84532:
              raise RuntimeError(f"Expected chain ID 84532, received {chain_id}")

          bytecode = rpc("eth_getCode", [contract_address, "latest"])
          if bytecode == "0x":
              raise RuntimeError(f"No deployed bytecode found at {contract_address}")

          receipt = rpc("eth_getTransactionReceipt", [tx_hash])
          if not receipt:
              raise RuntimeError("Creation transaction receipt is unavailable")
          if int(receipt["status"], 16) != 1:
              raise RuntimeError("Creation transaction failed")
          if (receipt.get("contractAddress") or "").lower() != contract_address.lower():
              raise RuntimeError("Receipt contract address does not match expected address")

          transaction = rpc("eth_getTransactionByHash", [tx_hash])
          if not transaction:
              raise RuntimeError("Creation transaction is unavailable")
          if transaction.get("from", "").lower() != deployer_address.lower():
              raise RuntimeError("Creation transaction deployer does not match expected deployer")
          if transaction.get("to") is not None:
              raise RuntimeError("Recovered transaction is not a contract creation")
          if int(transaction.get("nonce", "0x0"), 16) != 0:
              raise RuntimeError("Creation transaction nonce is not zero")

          evidence = {
              "network": "base-sepolia",
              "chainId": chain_id,
              "contractName": "TradeProofRegistry",
              "address": contract_address,
              "transactionHash": tx_hash,
              "blockNumber": str(int(receipt["blockNumber"], 16)),
              "deployer": deployer_address,
              "registrySourceCommit": "27248faeed7f3eb88428fa8ce7979223e088429f",
              "deploymentCarrierCommit": os.environ["GITHUB_SHA"],
              "bytecodeSizeBytes": (len(bytecode) - 2) // 2,
              "bytecodeVerified": True,
              "sourceVerification": "not-yet-recorded",
              "explorerUrl": f"https://sepolia.basescan.org/address/{contract_address}",
          }
          with open("deployment-output/base-sepolia.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2)
              handle.write("\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: trade-proof-registry-base-sepolia
          path: deployment-output/base-sepolia.json
          if-no-files-found: error

      - name: Publish result to deployment carrier PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TX_HASH="$(jq -r '.transactionHash' deployment-output/base-sepolia.json)"
          BLOCK_NUMBER="$(jq -r '.blockNumber' deployment-output/base-sepolia.json)"
          BYTECODE_SIZE="$(jq -r '.bytecodeSizeBytes' deployment-output/base-sepolia.json)"
          cat > deployment-output/pr-comment.md <<EOF
          <!-- trade-proof-deployment-result -->
          ## Base Sepolia deployment: PASS

          - Contract: \`TradeProofRegistry\`
          - Address: \`$CONTRACT_ADDRESS\`
          - Transaction: \`$TX_HASH\`
          - Block: \`$BLOCK_NUMBER\`
          - Deployer: \`$DEPLOYER_ADDRESS\`
          - Chain ID: \`84532\`
          - Deployed bytecode: \`$BYTECODE_SIZE bytes\`
          - Registry source commit: \`27248faeed7f3eb88428fa8ce7979223e088429f\`
          - Bytecode check: **PASS**
          - Source verification: pending

          Explorer: https://sepolia.basescan.org/address/$CONTRACT_ADDRESS
          EOF

          COMMENT_ID="$(gh api repos/moseszhu999/chaintrace-contracts/issues/2/comments --paginate --jq '.[] | select(.body | contains("<!-- trade-proof-deployment-result -->")) | .id' | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/moseszhu999/chaintrace-contracts/issues/comments/$COMMENT_ID" --raw-field body="$(cat deployment-output/pr-comment.md)"
          else
            gh pr comment 2 --repo moseszhu999/chaintrace-contracts --body-file deployment-output/pr-comment.md
          fi
