name: Contract validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Parse deployment manifest template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("deployments/base-sepolia-economic-stack.template.json").read_text())
          assert data["chainId"] == 84532
          assert data["status"] == "template-not-deployed"
          assert data["token"]["maxSupplyTokens"] == "1000000000"
          assert data["token"]["publicSaleActive"] is False
          assert data["token"]["claimActive"] is False
          assert data["token"]["liquidityPoolActive"] is False
          assert data["boundaries"]["testnetOnly"] is True
          assert data["boundaries"]["mainnetAuthorized"] is False
          print("PASS: bounded Base Sepolia manifest template")
          PY

      - name: Check canonical contract formatting
        run: |
          forge fmt --check \
            contracts/TradeProofRegistry.sol \
            contracts/TradeProofContribution.sol \
            contracts/TradeProofToken.sol \
            contracts/TradeProofTeamVesting.sol \
            contracts/TradeProofGenesis.sol \
            contracts/TradeProofSeasonAllocation.sol \
            contracts/TradeProofTestnetTreasuryVault.sol \
            test/TradeProofRegistry.t.sol \
            test/TradeProofContribution.t.sol \
            test/TradeProofToken.t.sol \
            test/TradeProofSeasonAllocation.t.sol \
            test/TradeProofEconomicStack.t.sol \
            script/DeployTradeProofRegistry.s.sol \
            script/DeployTradeProofEconomicStack.s.sol

      - name: Build deployable contracts with EIP-170 size gates
        run: forge build --sizes --skip script

      - name: Compile Foundry deployment scripts
        run: |
          forge build script/DeployTradeProofRegistry.s.sol
          forge build script/DeployTradeProofEconomicStack.s.sol

      - name: Run tests
        run: forge test -vvv

  dlsk:
    name: DLSK high-risk gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Checkout DeFi Launch Safety Kit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/defi-launch-safety-kit
          path: dlsk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DLSK
        run: python -m pip install -e ./dlsk

      - name: Scan Solidity contracts
        run: |
          dlsk scan \
            --source contracts \
            --format all \
            --out reports/dlsk \
            --no-slither

      - name: Block high or critical findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/dlsk/report.json").read_text(encoding="utf-8"))
          counts = report.get("counts", {})
          high = int(counts.get("HIGH", 0))
          critical = int(counts.get("CRITICAL", 0))
          print(f"DLSK findings: HIGH={high}, CRITICAL={critical}")
          if high or critical:
              raise SystemExit("DLSK high-risk gate failed")
          PY

  probe_economic_stack_state:
    name: Read-only Base Sepolia economic-stack state probe
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ops/base-sepolia-economic-stack-carrier-v0.1'
    needs: [foundry, dlsk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      RAW_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      EXPECTED_OPERATOR: "0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9"
      EXPECTED_NONCE: "2"
      TRADE_PROOF_REGISTRY: "0xad1c714140ceb8ed7c5234d939a06926f5edaba2"

    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read public chain state without signing or broadcasting
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAW_PRIVATE_KEY:-}" ]; then
            echo "DEPLOYER_PRIVATE_KEY is not configured."
            exit 1
          fi
          PRIVATE_KEY="$RAW_PRIVATE_KEY"
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          echo "::add-mask::$PRIVATE_KEY"

          OPERATOR="$(cast wallet address --private-key "$PRIVATE_KEY")"
          CHAIN_ID="$(cast chain-id --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          BALANCE_WEI="$(cast balance "$OPERATOR" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          NONCE="$(cast nonce "$OPERATOR" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          REGISTRY_CODE="$(cast code "$TRADE_PROOF_REGISTRY" --rpc-url "$BASE_SEPOLIA_RPC_URL")"

          test "$CHAIN_ID" = "84532"
          test "${OPERATOR,,}" = "${EXPECTED_OPERATOR,,}"
          test "$REGISTRY_CODE" != "0x"
          REGISTRY_CODE_BYTES="$(( (${#REGISTRY_CODE} - 2) / 2 ))"

          if [ "$NONCE" = "$EXPECTED_NONCE" ]; then
            NONCE_STATUS="baseline-clear"
          elif [ "$NONCE" -gt "$EXPECTED_NONCE" ]; then
            NONCE_STATUS="advanced-do-not-retrigger"
          else
            NONCE_STATUS="unexpected-below-baseline"
          fi

          echo "PROBE_OPERATOR=$OPERATOR" >> "$GITHUB_ENV"
          echo "PROBE_CHAIN_ID=$CHAIN_ID" >> "$GITHUB_ENV"
          echo "PROBE_BALANCE_WEI=$BALANCE_WEI" >> "$GITHUB_ENV"
          echo "PROBE_NONCE=$NONCE" >> "$GITHUB_ENV"
          echo "PROBE_NONCE_STATUS=$NONCE_STATUS" >> "$GITHUB_ENV"
          echo "PROBE_REGISTRY_CODE_BYTES=$REGISTRY_CODE_BYTES" >> "$GITHUB_ENV"

      - name: Publish exact read-only result to carrier PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/economic-stack-probe.md <<EOF
          ## Base Sepolia economic-stack read-only probe

          - Run: \`$GITHUB_RUN_ID\`
          - Carrier head: \`$GITHUB_SHA\`
          - Operator: \`$PROBE_OPERATOR\`
          - Chain ID: \`$PROBE_CHAIN_ID\`
          - Balance: \`$PROBE_BALANCE_WEI wei\`
          - Nonce: \`$PROBE_NONCE\`
          - Nonce status: **$PROBE_NONCE_STATUS**
          - Canonical Registry bytecode: \`$PROBE_REGISTRY_CODE_BYTES bytes\`

          This probe was read-only. It signed and sent no transaction.
          EOF
          gh pr comment "$GITHUB_EVENT_NUMBER" \
            --repo moseszhu999/chaintrace-contracts \
            --body-file /tmp/economic-stack-probe.md

          if [ "$PROBE_NONCE_STATUS" != "baseline-clear" ]; then
            echo "Operator nonce is not the expected clean baseline." >&2
            exit 1
          fi
