name: Contract validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  foundry:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Parse deployment manifest template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("deployments/base-sepolia-economic-stack.template.json").read_text())
          assert data["chainId"] == 84532
          assert data["status"] == "template-not-deployed"
          assert data["token"]["maxSupplyTokens"] == "1000000000"
          assert data["token"]["publicSaleActive"] is False
          assert data["token"]["claimActive"] is False
          assert data["token"]["liquidityPoolActive"] is False
          assert data["boundaries"]["testnetOnly"] is True
          assert data["boundaries"]["mainnetAuthorized"] is False
          print("PASS: bounded Base Sepolia manifest template")
          PY

      - name: Check canonical contract formatting
        run: |
          forge fmt --check \
            contracts/TradeProofRegistry.sol \
            contracts/TradeProofContribution.sol \
            contracts/TradeProofToken.sol \
            contracts/TradeProofTeamVesting.sol \
            contracts/TradeProofGenesis.sol \
            contracts/TradeProofSeasonAllocation.sol \
            contracts/TradeProofTestnetTreasuryVault.sol \
            test/TradeProofRegistry.t.sol \
            test/TradeProofContribution.t.sol \
            test/TradeProofToken.t.sol \
            test/TradeProofSeasonAllocation.t.sol \
            test/TradeProofEconomicStack.t.sol \
            script/DeployTradeProofRegistry.s.sol \
            script/DeployTradeProofEconomicStack.s.sol

      - name: Build deployable contracts with EIP-170 size gates
        run: forge build --sizes --skip script

      - name: Compile Foundry deployment scripts
        run: |
          forge build script/DeployTradeProofRegistry.s.sol
          forge build script/DeployTradeProofEconomicStack.s.sol

      - name: Run tests
        run: forge test -vvv

  dlsk:
    name: DLSK high-risk gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Checkout DeFi Launch Safety Kit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/defi-launch-safety-kit
          path: dlsk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DLSK
        run: python -m pip install -e ./dlsk

      - name: Scan Solidity contracts
        run: |
          dlsk scan \
            --source contracts \
            --format all \
            --out reports/dlsk \
            --no-slither

      - name: Block high or critical findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/dlsk/report.json").read_text(encoding="utf-8"))
          counts = report.get("counts", {})
          high = int(counts.get("HIGH", 0))
          critical = int(counts.get("CRITICAL", 0))
          print(f"DLSK findings: HIGH={high}, CRITICAL={critical}")
          if high or critical:
              raise SystemExit("DLSK high-risk gate failed")
          PY

  probe-economic-stack-state:
    name: Read-only Base Sepolia economic-stack state probe
    needs: [foundry, dlsk]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 13 &&
      github.head_ref == 'ops/base-sepolia-economic-stack-carrier-v0.1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'moseszhu999'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RPC_URL: https://sepolia.base.org
      EXPECTED_CHAIN_ID: "84532"
      EXPECTED_OPERATOR: 0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9
      EXPECTED_POST_REGISTRY_NONCE: "2"
      TRADE_PROOF_REGISTRY: 0xad1c714140ceb8ed7c5234d939a06926f5edaba2

    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read public chain state without signing or broadcasting
        id: probe
        env:
          RAW_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "$RAW_PRIVATE_KEY" ]; then
            echo "DEPLOYER_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          PRIVATE_KEY="$RAW_PRIVATE_KEY"
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) PRIVATE_KEY="0x$PRIVATE_KEY" ;;
          esac
          echo "::add-mask::$PRIVATE_KEY"
          OPERATOR="$(cast wallet address --private-key "$PRIVATE_KEY")"
          ACTUAL_CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          BALANCE_WEI="$(cast balance "$OPERATOR" --wei --rpc-url "$RPC_URL")"
          NONCE="$(cast nonce "$OPERATOR" --rpc-url "$RPC_URL")"
          REGISTRY_CODE="$(cast code "$TRADE_PROOF_REGISTRY" --rpc-url "$RPC_URL")"
          test "$(printf '%s' "$OPERATOR" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$EXPECTED_OPERATOR" | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CHAIN_ID" = "$EXPECTED_CHAIN_ID"
          test "$REGISTRY_CODE" != "0x"
          REGISTRY_CODE_BYTES=$(( (${#REGISTRY_CODE} - 2) / 2 ))
          if [ "$NONCE" -eq "$EXPECTED_POST_REGISTRY_NONCE" ]; then
            NONCE_STATUS="baseline-clear"
          elif [ "$NONCE" -gt "$EXPECTED_POST_REGISTRY_NONCE" ]; then
            NONCE_STATUS="advanced-do-not-retrigger"
          else
            NONCE_STATUS="unexpected-below-baseline"
          fi
          {
            echo "operator=$OPERATOR"
            echo "chain_id=$ACTUAL_CHAIN_ID"
            echo "balance_wei=$BALANCE_WEI"
            echo "nonce=$NONCE"
            echo "nonce_status=$NONCE_STATUS"
            echo "registry_code_bytes=$REGISTRY_CODE_BYTES"
          } >> "$GITHUB_OUTPUT"

      - name: Record probe result on carrier PR
        uses: actions/github-script@v7
        env:
          OPERATOR: ${{ steps.probe.outputs.operator }}
          CHAIN_ID_VALUE: ${{ steps.probe.outputs.chain_id }}
          BALANCE_WEI: ${{ steps.probe.outputs.balance_wei }}
          NONCE_VALUE: ${{ steps.probe.outputs.nonce }}
          NONCE_STATUS: ${{ steps.probe.outputs.nonce_status }}
          REGISTRY_CODE_BYTES: ${{ steps.probe.outputs.registry_code_bytes }}
        with:
          script: |
            const body = [
              '## Base Sepolia economic-stack read-only probe',
              '',
              `- Run: \`${context.runId}\``,
              `- Carrier head: \`${context.sha}\``,
              `- Operator: \`${process.env.OPERATOR}\``,
              `- Chain ID: \`${process.env.CHAIN_ID_VALUE}\``,
              `- Balance: \`${process.env.BALANCE_WEI} wei\``,
              `- Nonce: \`${process.env.NONCE_VALUE}\``,
              `- Nonce status: **${process.env.NONCE_STATUS}**`,
              `- Canonical Registry bytecode: \`${process.env.REGISTRY_CODE_BYTES} bytes\``,
              '',
              'This probe was read-only. It signed and sent no transaction.',
              '',
              process.env.NONCE_STATUS === 'baseline-clear'
                ? 'The operator remains at the expected post-Registry baseline. No economic-stack transaction has advanced the wallet nonce.'
                : 'Do not authorize or repeat deployment until this nonce is reconciled.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              body
            });

      - name: Block deployment progression when nonce is not the clean baseline
        if: steps.probe.outputs.nonce_status != 'baseline-clear'
        run: |
          echo "Operator nonce is not the expected clean baseline." >&2
          exit 1

      - name: Record bounded probe failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              body: `Base Sepolia integrated read-only probe failed. It authorized no transaction. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
