name: Contract validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundry:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Apply bounded implementation fix and canonical formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/trade-proof-contribution-v0.1'
        run: |
          python tools/apply-contribution-fix.py
          forge fmt contracts/TradeProofContribution.sol test/TradeProofContribution.t.sol
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/TradeProofContribution.sol test/TradeProofContribution.t.sol
            git commit -m "fix: reduce contribution validation stack depth"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check canonical contract formatting
        run: |
          forge fmt --check \
            contracts/TradeProofRegistry.sol \
            contracts/TradeProofContribution.sol \
            test/TradeProofRegistry.t.sol \
            test/TradeProofContribution.t.sol \
            script/DeployTradeProofRegistry.s.sol

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

  dlsk:
    name: DLSK high-risk gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Checkout DeFi Launch Safety Kit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/defi-launch-safety-kit
          path: dlsk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DLSK
        run: python -m pip install -e ./dlsk

      - name: Scan Solidity contracts
        run: |
          dlsk scan \
            --source contracts \
            --format all \
            --out reports/dlsk \
            --no-slither

      - name: Block high or critical findings
        run: python tools/print-dlsk-high.py
