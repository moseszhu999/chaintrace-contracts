name: Contract validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

  dlsk:
    name: DLSK high-risk gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contracts
        uses: actions/checkout@v4

      - name: Checkout DeFi Launch Safety Kit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/defi-launch-safety-kit
          path: dlsk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DLSK
        run: python -m pip install -e ./dlsk

      - name: Scan Solidity contracts
        run: |
          dlsk scan \
            --source contracts \
            --profile all \
            --format all \
            --out reports/dlsk \
            --no-slither \
            --fail-on high
