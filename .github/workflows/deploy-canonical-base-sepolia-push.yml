name: Push deploy canonical TradeProofRegistry

on:
  push:
    branches:
      - deploy/base-sepolia-trade-proof-registry-canonical-v1

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: trade-proof-registry-base-sepolia-canonical-v1
  cancel-in-progress: false

env:
  BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
  RAW_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
  EXPECTED_DEPLOYER: 0x072A01FE3DdbF351DAaf6Da70CE5E67f5101fEC9

jobs:
  deploy:
    name: One-shot canonical Base Sepolia deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Preflight exact nonce and balance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAW_PRIVATE_KEY:-}"
          PRIVATE_KEY="$RAW_PRIVATE_KEY"
          case "$PRIVATE_KEY" in 0x*) ;; *) PRIVATE_KEY="0x$PRIVATE_KEY" ;; esac
          test "$(cast chain-id --rpc-url "$BASE_SEPOLIA_RPC_URL")" = "84532"
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          NONCE="$(cast nonce "$DEPLOYER" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          BALANCE="$(cast balance "$DEPLOYER" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          test "${DEPLOYER,,}" = "${EXPECTED_DEPLOYER,,}"
          if [ "$NONCE" != "1" ]; then
            echo "Expected nonce 1, received $NONCE. Refusing deployment."
            exit 1
          fi
          if [ "$BALANCE" -lt 20000000000000 ]; then
            echo "Insufficient balance: $BALANCE wei"
            exit 1
          fi
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "DEPLOYER_ADDRESS=$DEPLOYER" >> "$GITHUB_ENV"

      - name: Build and test reviewed source
        run: |
          forge build --sizes
          forge test -vvv

      - name: Deploy and capture exact transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-output
          forge create contracts/TradeProofRegistry.sol:TradeProofRegistry \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --json | tee deployment-output/create.json
          CONTRACT_ADDRESS="$(jq -r '.deployedTo // .deployed_to // empty' deployment-output/create.json)"
          TX_HASH="$(jq -r '.transactionHash // .transaction_hash // empty' deployment-output/create.json)"
          test -n "$CONTRACT_ADDRESS"
          test -n "$TX_HASH"
          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> "$GITHUB_ENV"
          echo "TX_HASH=$TX_HASH" >> "$GITHUB_ENV"

      - name: Verify receipt and write evidence
        shell: bash
        run: |
          set -euo pipefail
          cast receipt "$TX_HASH" --rpc-url "$BASE_SEPOLIA_RPC_URL" --json > deployment-output/receipt.json
          STATUS="$(jq -r '.status' deployment-output/receipt.json)"
          RECEIPT_ADDRESS="$(jq -r '.contractAddress // .contract_address // empty' deployment-output/receipt.json)"
          BLOCK_VALUE="$(jq -r '.blockNumber // .block_number' deployment-output/receipt.json)"
          test "$STATUS" = "0x1" -o "$STATUS" = "1"
          test "${RECEIPT_ADDRESS,,}" = "${CONTRACT_ADDRESS,,}"
          BYTECODE="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$BASE_SEPOLIA_RPC_URL")"
          test "$BYTECODE" != "0x"
          export BLOCK_VALUE
          BLOCK_NUMBER="$(python -c 'import os; v=os.environ["BLOCK_VALUE"]; print(int(v,16) if v.startswith("0x") else int(v))')"
          BYTECODE_SIZE="$(( (${#BYTECODE} - 2) / 2 ))"
          jq -n \
            --arg address "$CONTRACT_ADDRESS" \
            --arg transactionHash "$TX_HASH" \
            --arg blockNumber "$BLOCK_NUMBER" \
            --arg deployer "$DEPLOYER_ADDRESS" \
            --arg deploymentCarrierCommit "$GITHUB_SHA" \
            --arg bytecodeSizeBytes "$BYTECODE_SIZE" \
            '{
              network:"base-sepolia",
              chainId:84532,
              contractName:"TradeProofRegistry",
              address:$address,
              transactionHash:$transactionHash,
              blockNumber:$blockNumber,
              deployer:$deployer,
              registrySourceCommit:"27248faeed7f3eb88428fa8ce7979223e088429f",
              deploymentCarrierCommit:$deploymentCarrierCommit,
              bytecodeSizeBytes:($bytecodeSizeBytes|tonumber),
              bytecodeVerified:true,
              sourceVerification:"not-yet-recorded",
              explorerUrl:("https://sepolia.basescan.org/address/"+$address),
              canonical:true
            }' > deployment-output/base-sepolia.json
          cat deployment-output/base-sepolia.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: trade-proof-registry-base-sepolia-canonical
          path: deployment-output/
          if-no-files-found: error

      - name: Comment exact result on PR 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BLOCK_NUMBER="$(jq -r '.blockNumber' deployment-output/base-sepolia.json)"
          BYTECODE_SIZE="$(jq -r '.bytecodeSizeBytes' deployment-output/base-sepolia.json)"
          gh pr comment 5 --repo moseszhu999/chaintrace-contracts --body "## Canonical Base Sepolia deployment: PASS

- Contract: \`TradeProofRegistry\`
- Address: \`$CONTRACT_ADDRESS\`
- Transaction: \`$TX_HASH\`
- Block: \`$BLOCK_NUMBER\`
- Deployer: \`$DEPLOYER_ADDRESS\`
- Chain ID: \`84532\`
- Deployed bytecode: \`$BYTECODE_SIZE bytes\`
- Registry source: \`27248faeed7f3eb88428fa8ce7979223e088429f\`
- Bytecode check: **PASS**
- Source verification: pending

https://sepolia.basescan.org/address/$CONTRACT_ADDRESS"
